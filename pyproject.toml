[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newsdesk"
version = "0.1.0"
description = "Watchlist-driven news collection agent with provenance-first logging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "sqlmodel>=0.0.16",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
media = [
    "yt-dlp>=2025.1",           # video-platform fetcher (youtube, bilibili, ...)
]
vision = [
    "imageio-ffmpeg>=0.5",      # static ffmpeg for keyframe extraction
]
mcp = [
    "mcp>=1.2",                 # agent-harness addon surface (stdio)
]
accounts = [
    "keyring>=24",              # optional OS-keyring credential storage
]
all = [
    "newsdesk[media,vision,mcp,accounts]",
]

[project.scripts]
newsdesk = "newsdesk.cli:main"
newsdesk-mcp = "newsdesk.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["newsdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
