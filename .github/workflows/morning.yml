# The morning briefing, unattended (morning-audio-impl ticket 07).
#
# One cron at 23:07 UTC = 07:07 HKT daily; the publish-by-08:30 deadline has
# 83 minutes of slack for median runner delays plus the ~10-minute pipeline.
# Failure visibility is GitHub's automatic workflow-failure email — no retry
# fire, no dead-man's switch (schedule policy, wayfinder ticket 06). Setup,
# rehearsal, and cost math: docs/morning-actions.md.
#
# W4 (workflow-modules ticket 12): the job is a matrix over station ids —
# one scheduled run produces every station's feed. `fail-fast: false`
# isolates the legs (one station's failure never cancels its siblings) and
# `continue-on-error` is deliberately absent: a failed leg must fail the
# run, or the failure email — the only alerting channel — goes silent
# (research: docs/research/gha-station-topology.md). Each leg publishes one
# station (NEWSDESK_STATION) and stages the union of all stations'
# archives, so no deploy ever drops another station's history. Adding a
# station = one seed entry + one matrix entry.
#
# Ticket 04: each leg also archives its episode bundle (pre-TTS script +
# version-aware meta) under briefing/ and commits it back to main — the
# feed carries audio only, so the repo commit is the content source of
# record (see docs/morning-actions.md).
name: morning

on:
  schedule:
    - cron: "7 23 * * *"   # 07:07 Asia/Hong_Kong, every day
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill episode date YYYY-MM-DD (morning tz). Empty = today."
        required: false
        type: string
      fail:
        description: "Deliberate-failure probe: exit 1 before any work (tests the failure-email channel)"
        required: false
        type: boolean
        default: false

permissions:
  # ticket 04: the archive step commits episode bundles back to main
  contents: write

concurrency:
  group: morning
  cancel-in-progress: false   # overlapping runs queue; the idempotency guard no-ops the loser

jobs:
  morning:
    runs-on: ubuntu-latest
    # per station leg (a matrix job is one job def × N legs)
    timeout-minutes: 45
    strategy:
      fail-fast: false      # legs live or die alone; siblings keep publishing
      matrix:
        station: [morning-briefing, papers]  # keep in sync with the seed's stations
    env:
      NEWSDESK_PUBLISHER: cloudflare-pages
      NEWSDESK_FEED_BASE_URL: ${{ vars.NEWSDESK_FEED_BASE_URL }}
      NEWSDESK_FEED_TOKEN: ${{ secrets.NEWSDESK_FEED_TOKEN }}
      NEWSDESK_CLOUDFLARE_API_TOKEN: ${{ secrets.NEWSDESK_CLOUDFLARE_API_TOKEN }}
      NEWSDESK_CLOUDFLARE_ACCOUNT_ID: ${{ vars.NEWSDESK_CLOUDFLARE_ACCOUNT_ID }}
      NEWSDESK_CLOUDFLARE_PROJECT: ${{ vars.NEWSDESK_CLOUDFLARE_PROJECT }}
      # the only per-station env: the CLI resolves scope, workflow, feed
      # identity and token subpath from the station row (seeded below)
      NEWSDESK_STATION: ${{ matrix.station }}
      # Optional: no key => NullAdapter => extractive episode still publishes.
      NEWSDESK_LLM_API_KEY: ${{ secrets.NEWSDESK_LLM_API_KEY }}
      NEWSDESK_LLM_BASE_URL: ${{ vars.NEWSDESK_LLM_BASE_URL }}
      NEWSDESK_LLM_MODEL: ${{ vars.NEWSDESK_LLM_MODEL }}
      # optional fallback chain (comma-separated model ids); empty = single model
      NEWSDESK_LLM_FALLBACK_MODELS: ${{ vars.NEWSDESK_LLM_FALLBACK_MODELS }}
      # optional JSON merged into every LLM request body (e.g. reasoning_effort)
      NEWSDESK_LLM_EXTRA_JSON: ${{ vars.NEWSDESK_LLM_EXTRA_JSON }}
      # dispatch inputs reach the script only via env (never inline) — injection-safe
      MORNING_DATE: ${{ inputs.date }}
      MORNING_FAIL_PROBE: ${{ inputs.fail }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the archive commit rebases onto fresh main before push (matrix
          # legs race); a shallow clone cannot rebase
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install newsdesk (with the tts extra)
        run: |
          python -m pip install --upgrade pip
          pip install .[tts]

      - name: Install wrangler (cloudflare-pages transport)
        run: npm install -g wrangler

      # The runner DB starts empty; sources, watchlists, workflows and
      # stations ride in the repo.
      - name: Seed sources, watchlists, workflows, stations
        run: newsdesk seed import seed/newsdesk-seed.json

      - name: Run the morning
        run: |
          set -euo pipefail
          if [ "$MORNING_FAIL_PROBE" = "true" ]; then
            echo "deliberate-failure probe: no work done, job fails on purpose"
            exit 1
          fi
          args=()
          if [ -n "$MORNING_DATE" ]; then
            args+=(--date "$MORNING_DATE")
          fi
          newsdesk morning --json --archive briefing "${args[@]}"

      # Ticket 04: the repo commit is the content source of record — the
      # feed carries audio only. Legs race on push; bundle paths are
      # disjoint per station, so a rebase replay never conflicts.
      - name: Commit the episode archive back to main
        run: |
          set -euo pipefail
          if [ ! -d briefing ]; then
            echo "no episode bundle this leg (already-published re-run)"
            exit 0
          fi
          git add briefing
          if git diff --cached --quiet; then
            echo "episode archive unchanged — nothing to commit"
            exit 0
          fi
          ep_date=$(git diff --cached --name-only \
                    | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          git -c user.name=newsdesk-bot \
              -c user.email=newsdesk-bot@users.noreply.github.com \
              commit -m "episode(${NEWSDESK_STATION}): archive ${ep_date:-unknown}"
          for attempt in 1 2 3; do
            if git fetch origin main \
               && git rebase origin/main \
               && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "could not push the episode archive after 3 attempts" >&2
          exit 1
